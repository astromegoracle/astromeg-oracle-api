<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refreshing Astromeg Preview</title>
    <style>
      :root {
        color: #fffaff;
        background: #5b3b86;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 2rem;
        background:
          radial-gradient(circle at 22% 16%, rgba(255, 255, 255, 0.36), transparent 32%),
          radial-gradient(circle at 78% 22%, rgba(190, 231, 241, 0.25), transparent 34%),
          linear-gradient(135deg, #4f347e, #8b5ca3 55%, #bf7ab0);
      }

      main {
        width: min(100%, 24rem);
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.46);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 1.25rem 3rem rgba(48, 25, 57, 0.22);
        text-align: center;
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
      }

      h1 {
        margin: 0 0 0.65rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.55rem;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: rgba(255, 250, 255, 0.78);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Refreshing preview</h1>
      <p>Clearing the old phone preview cache and opening the newest Astromeg app.</p>
    </main>
    <script>
      const nextUrl = "./?v=google-auth-v1#start";

      async function resetPreview() {
        if ("caches" in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        }

        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        window.location.replace(nextUrl);
      }

      resetPreview().catch(() => {
        window.location.replace(nextUrl);
      });
    </script>
  </body>
</html>
